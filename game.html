<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Platform - Игра</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">

    <script src="js/lib/toml/toml.js"></script>
</head>
<body>
<div class="game-container">
    <!-- Фон сцены -->
    <div class="scene-background" id="sceneBackground"></div>

    <!-- Контейнер для персонажей -->
    <div class="characters-container" id="charactersContainer"></div>

    <!-- Диалоговое окно -->
    <div class="dialogue-container active" id="dialogueContainer">
        <div class="dialogue-box">
            <div class="character-name" id="characterName"></div>
            <div class="dialogue-text" id="dialogueText"></div>
            <div class="next-indicator">▼</div>
        </div>
    </div>

    <!-- Контейнер для выбора -->
    <div class="choices-container" id="choicesContainer"></div>

    <!-- Панель управления -->
    <div class="control-panel">
        <button id="menuBtn" class="btn btn-secondary">Меню</button>
    </div>

    <!-- Индикатор загрузки -->
    <!--<div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Загрузка...</div>
    </div>-->
</div>

<!-- Меню паузы -->
<div id="pauseMenu" class="modal">
    <div class="modal-content">
        <h2>Меню</h2>
        <button id="resumeBtn" class="btn btn-primary">Продолжить</button>
        <button id="restartBtn" class="btn btn-secondary">Начать заново</button>
        <button id="quitBtn" class="btn btn-secondary">Выйти в меню</button>
    </div>
</div>

<script src="js/utils.js"></script>
<script src="js/views/character.js"></script>
<script src="js/views/choice.js"></script>
<script src="js/views/dialogue.js"></script>
<script src="js/scene.js"></script>
<script src="js/game.js"></script>

<script>
    document.getElementById('menuBtn').onclick = () =>
        document.getElementById('pauseMenu').style.display = 'block';
    document.getElementById('resumeBtn').onclick = () =>
        document.getElementById('pauseMenu').style.display = 'none';
    document.getElementById('quitBtn').onclick = () =>
        window.location.href = 'index.html';
    document.getElementById('restartBtn').onclick = async () => {
        if (confirm('Начать игру заново?'))
            window.location.reload();
    };

    const params = Utils.getUrlParams();

    const gameId = params.get('game_id');
    const currentSceneId = params.get('scene_id');

    if (!gameId || !currentSceneId)
        throw new Error('Missing required game parameters');

    const game = new Game();
    game.initScene(new SceneAPI(currentSceneId)).then(() => game.start());
</script>
</body>
</html>
