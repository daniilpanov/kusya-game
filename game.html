<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Platform - Игра</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">

    <script src="js/lib/toml/toml.js"></script>
    <script src="js/lib/expressions/expressions.js"></script>
    <script src="js/lib/templater/templater.js"></script>
    <script src="js/lib/typer/typer.js"></script>
    <script src="js/templater_typer_extension.js"></script>
</head>
<body>
<div class="game-container">
    <!-- Фон сцены -->
    <div class="scene-background" id="sceneBackground"></div>

    <!-- Контейнер для персонажей -->
    <div class="characters-container" id="charactersContainer"></div>

    <!-- Диалоговое окно -->
    <div class="dialogue-container active" id="dialogueContainer"></div>

    <!-- Контейнер для выбора -->
    <div class="choices-container" id="choicesContainer"></div>

    <!-- Scene title -->
    <div class="scene-title inactive" id="sceneTitle"></div>

    <!-- Панель управления -->
    <div class="control-panel">
        <button id="menuBtn" class="btn btn-secondary">Меню</button>
    </div>

    <!-- Индикатор загрузки -->
    <!--<div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Загрузка...</div>
    </div>-->
</div>

<!-- Меню паузы -->
<div id="pauseMenu" class="modal">
    <div class="modal-content">
        <h2>Меню</h2>
        <button id="resumeBtn" class="btn btn-primary">Продолжить</button>
        <button id="restartBtn" class="btn btn-secondary">Начать заново</button>
        <button id="quitBtn" class="btn btn-secondary">Выйти в меню</button>
    </div>
</div>

<script src="js/utils.js"></script>
<script src="js/person.js"></script>
<script src="js/scene.js"></script>
<script src="js/game.js"></script>

<script>
    document.getElementById('menuBtn').onclick = () =>
        document.getElementById('pauseMenu').style.display = 'block';
    document.getElementById('resumeBtn').onclick = () =>
        document.getElementById('pauseMenu').style.display = 'none';
    document.getElementById('quitBtn').onclick = () =>
        window.location.href = 'index.html';
    document.getElementById('restartBtn').onclick = async () => {
        if (confirm('Начать игру заново?'))
            window.location.reload();
    };

    const params = Utils.getUrlParams();

    const gameResource = params.get('game_resource');
    const gameDescriptorUri = params.get('game_descriptor_uri');

    if (!gameResource || !gameDescriptorUri)
        throw new Error('Missing required gameDescriptorUri');

    const game = new Game(
        gameResource,
        gameDescriptorUri,
        document.getElementById("sceneBackground"),
        {
            dialog: document.getElementById("dialogueContainer"),
            choices: document.getElementById("choicesContainer"),
            sceneTitle: document.getElementById("sceneTitle"),
        },
    );
    window.game = game;

    game.init()
        .then(({ headInjections, spriteImages }) => {
            headInjections.forEach(item => document.head.appendChild(item));

            const charactersContainer = document.getElementById('charactersContainer');
            spriteImages.forEach(img => {
                img.classList.add("character", "hidden");
                charactersContainer.appendChild(img);
            });
        })
        .then(() => game.doNextActionsGroup());

    window.addEventListener("click", ev => {
        const isButtonClicked = ev.target.tagName === "BUTTON" || ev.target.tagName === "A";

        if (isButtonClicked && (ev.target.id === "menuBtn" || !ev.target.closest(".game-container")))
            return;

        if (isButtonClicked)
            game.tryDoNextActionsGroup(true, {
                eventChoiceId: ev.target.getAttribute("data-bs-event-choice-id"),
                eventChoiceVariant: ev.target.getAttribute("data-bs-event-choice-variant"),
            });
        else
            game.tryDoNextActionsGroup(false);
    });
</script>
</body>
</html>
