<div class="ng--container ng--choices-container">
    <div class="ng--wrapper ng--choices-wrapper">
        <div class="ng--author">
            <span data-bs-injection-key="author"></span>
        </div>
        <div class="ng--text">
            <span data-bs-injection-key="text"></span>
        </div>
        <div class="ng--choice-box">
            <div class="ng--choice-wrapper" data-bs-injection-key="choicesList" data-bs-injection-type="iter_mapFullItemToAttrs">
                <button
                        data-bs-injection-callback-id="choice"
                        data-bs-event-choice-id
                        data-bs-event-choice-variant
                ></button>
            </div>
        </div>
    </div>
</div>
