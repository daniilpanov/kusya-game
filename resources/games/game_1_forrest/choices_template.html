<style>
    .ng--author {
        background-color: darkred;
        color: white;
    }
    .ng--text {
        background-color: white;
        color: black;
    }
    .ng--choice-box button {
        background-color: darkred;
        color: white;
        border-radius: 1rem;
    }
</style>

<div class="ng--choices-wrapper">
    <div class="ng--choices-author">
        <span data-bs-injection-key="this.author"></span>
    </div>
    <div class="ng--choices-text">
        <span data-bs-injection-key="this.text"></span>
    </div>
    <div class="ng--choice-box" data-bs-injection-key="this.choicesList" data-bs-injection-type="iter.mapFullItemToAttrs">
        <button
                data-bs-event-id="choice"
                data-bs-event-choice-id
                data-bs-event-choice-variant
        ></button>
    </div>
</div>
