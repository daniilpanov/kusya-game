<div class="ng--choices-wrapper">
    <div class="ng--choices-author">
        <span data-bs-injection-key="author"></span>
    </div>
    <div class="ng--choices-text">
        <span data-bs-injection-key="text"></span>
    </div>
    <div class="ng--choice-box" data-bs-injection-key="choicesList" data-bs-injection-type="iter_mapFullItemToAttrs">
        <button
                data-bs-injection-callback-id="choice"
                data-bs-event-choice-id
                data-bs-event-choice-variant
        ></button>
    </div>
</div>
